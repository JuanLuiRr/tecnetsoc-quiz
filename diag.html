<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico P2P · TecnetSOC</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0a1120;color:#dbe7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;
    padding:1rem;font-size:1.05rem;line-height:1.5;max-width:40rem;margin:0 auto}
  h1{font-size:1.25rem;color:#67e8f9;margin:.2rem 0 .4rem}
  h3{margin:1.1rem 0 .3rem;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:#7f9cc8}
  p{color:#9db4d8;margin:.3rem 0 .8rem;font-size:.95rem}
  .big{font-size:1.35rem;font-weight:700;margin:.8rem 0;padding:.9rem;border-radius:.6rem;text-align:center}
  .yes{background:#0d3b1e;color:#66ffa6} .no{background:#3b0d12;color:#ff7b7b} .wait{background:#16243e;color:#9db4d8}
  .ok{color:#66ffa6;font-weight:700} .bad{color:#ff7b7b;font-weight:700}
  .row{margin:.25rem 0} code{background:#111a2e;padding:.1rem .35rem;border-radius:.25rem;font-size:.92em}
  .strat{font-family:ui-monospace,monospace;font-size:1rem;margin:.35rem 0;padding:.5rem .7rem;border-radius:.4rem;background:#111a2e;
    display:flex;justify-content:space-between;align-items:center}
  .strat b{font-size:1.05rem}
  #ice{font-family:ui-monospace,monospace;font-size:.9rem}
  .hint{font-size:.85rem;color:#9db4d8;margin-top:.6rem}
</style>

<h1>Diagnóstico P2P · TecnetSOC</h1>
<p>Abre <b>esta misma página</b> en los dos dispositivos. Prueba <b>3 vías de conexión a la vez</b> y te dice cuál funciona. Espera ~25 s sin cerrar.</p>

<div id="verdict" class="big wait">Iniciando las 3 vías…</div>

<div class="row">Mi id: <code id="me">—</code></div>

<h3>¿Cuál vía empareja los dos dispositivos?</h3>
<div id="strats"></div>

<h3>WebRTC / TURN (transporte)</h3>
<div id="ice">probando…</div>

<div class="hint" id="clock"></div>

<script type="module">
const $=id=>document.getElementById(id);
const ROOM="tnq-diag-8271";
const RELAYS=["wss://relay.damus.io","wss://nos.lol","wss://relay.primal.net","wss://nostr.mom"];
const ICE=[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun.cloudflare.com:3478"},
  {urls:"stun:stun.relay.metered.ca:80"},
  {urls:"turn:global.relay.metered.ca:80",username:"efc582a4f9f1aa53fe561b84",credential:"nq8iOwUwBUTLn9Fc"},
  {urls:"turn:global.relay.metered.ca:80?transport=tcp",username:"efc582a4f9f1aa53fe561b84",credential:"nq8iOwUwBUTLn9Fc"},
  {urls:"turn:global.relay.metered.ca:443",username:"efc582a4f9f1aa53fe561b84",credential:"nq8iOwUwBUTLn9Fc"},
  {urls:"turns:global.relay.metered.ca:443?transport=tcp",username:"efc582a4f9f1aa53fe561b84",credential:"nq8iOwUwBUTLn9Fc"}
];

/* ---- transporte: ICE / TURN ---- */
(function(){
  const pc=new RTCPeerConnection({iceServers:ICE}); const types=new Set();
  pc.onicecandidate=e=>{ if(e.candidate){const m=e.candidate.candidate.match(/typ (\w+)/); if(m)types.add(m[1]);} };
  pc.createDataChannel("x"); pc.createOffer().then(o=>pc.setLocalDescription(o));
  setTimeout(()=>{ const relay=types.has("relay");
    $("ice").innerHTML="candidatos: "+([...types].join(", ")||"ninguno")+
      ' · TURN: <span class="'+(relay?"ok":"bad")+'">'+(relay?"✓":"✗")+'</span>';
    try{pc.close()}catch(e){} },7000);
})();

/* ---- 3 vías de señalización en paralelo ---- */
const STRATS=[
  {key:"torrent",label:"BitTorrent"},
  {key:"nostr",  label:"Nostr"},
  {key:"mqtt",   label:"MQTT"}
];
const S={};                      // key -> {peers:{}, state}
const box=$("strats"); box.innerHTML="";
STRATS.forEach(st=>{
  S[st.key]={peers:{},el:null};
  const d=document.createElement("div"); d.className="strat";
  d.innerHTML='<b>'+st.label+'</b> <span class="v">cargando…</span>';
  box.appendChild(d); S[st.key].el=d.querySelector(".v");
});
function paint(key){
  const s=S[key]; const n=Object.keys(s.peers).length;
  s.el.innerHTML = s.err ? '<span class="bad">✗ '+s.err+'</span>'
    : n>0 ? '<span class="ok">✓ CONECTADO ('+n+')</span>'
    : '<span style="color:#9db4d8">buscando…</span>';
}
async function tryStrat(st){
  try{
    const mod=await import("https://esm.sh/trystero@0.21.5/"+st.key);
    if(!$("me").textContent||$("me").textContent==="—")$("me").textContent=mod.selfId.slice(0,10);
    const cfg={appId:"tecnetsoc-diag-multi",rtcConfig:{iceServers:ICE}};
    if(st.key==="nostr")cfg.relayUrls=RELAYS;
    const room=mod.joinRoom(cfg,ROOM);
    const [sendHi,getHi]=room.makeAction("hi");
    room.onPeerJoin(id=>{ S[st.key].peers[id]=1; sendHi("hola"); paint(st.key); });
    room.onPeerLeave(id=>{ delete S[st.key].peers[id]; paint(st.key); });
    getHi((d,id)=>{ S[st.key].peers[id]=1; paint(st.key); });
    setInterval(()=>{ try{sendHi("ping")}catch(e){} },4000);
    paint(st.key);
  }catch(e){ S[st.key].err=(e.message||"error").slice(0,30); paint(st.key); }
}
STRATS.forEach(tryStrat);

/* ---- veredicto ---- */
const t0=Date.now();
setInterval(()=>{
  const secs=Math.floor((Date.now()-t0)/1000);
  $("clock").textContent="tiempo: "+secs+"s";
  const ok=STRATS.filter(st=>Object.keys(S[st.key].peers).length>0).map(st=>st.label);
  const v=$("verdict");
  if(ok.length){ v.className="big yes"; v.textContent="✓ FUNCIONA con: "+ok.join(", "); return; }
  if(secs<26){ v.className="big wait"; v.textContent="Buscando al otro dispositivo… ("+secs+"s)"; return; }
  v.className="big no"; v.textContent="✗ Ninguna de las 3 vías conectó los dispositivos";
},1000);
</script>
